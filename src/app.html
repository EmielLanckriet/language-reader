<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!--
			The manifest is what turns "Add to Home screen" from a bookmark into an installation.
			Its own member URLs are relative so that one static file is correct both here and under
			the project subpath it is deployed to; this href cannot be, so it uses the base path
			SvelteKit substitutes. It has to be absolute because 404.html is this same shell served
			at arbitrary depths, where a relative href would resolve against the wrong directory.
		-->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />

		<!-- Colours the system bar in the installed window, so it does not sit in browser grey. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfdfb" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181a" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!--
			FR-008: a visit with no network, before the application has ever been fetched.

			This is the weakest point in the offline story and the markup is honest about how weak.
			If nothing at all has been cached, the browser never receives this page either and shows
			its own failure — there is nothing we can do from a device that holds none of us. What
			this *does* cover is the case where the shell arrives but the rest does not: a first
			visit cut short, a partial cache, a network that dies mid-load. In those, the reader
			would otherwise sit in front of a blank page indefinitely.

			Revealed on a timer rather than shown immediately, so a slow but successful start does
			not flash a failure notice at someone. The application removes it on boot, so a start
			slower than the timer corrects itself.
		-->
		<div
			id="not-downloaded"
			hidden
			style="
				max-width: 32rem;
				margin: 3rem auto;
				padding: 0 1.25rem;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
				color: #1a1a1a;
			"
		>
			<p><strong>This app has not finished downloading.</strong></p>
			<p>
				Connect to the internet once and open it again. After that it works with no network at all,
				including after restarting your phone.
			</p>
		</div>
		<script>
			window.__booted = false;
			setTimeout(function () {
				if (window.__booted) return;
				var notice = document.getElementById('not-downloaded');
				if (notice) notice.hidden = false;
			}, 5000);
		</script>
	</body>
</html>
